<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Práctico - Python</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --primary: #0056D2;
            --primary-hover: #0043A4;
            --bg-color: #F0F6FF;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --code-bg: #0F172A;
            --code-text: #E2E8F0;
            --shadow: 0 10px 40px -10px rgba(0, 86, 210, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 800px;
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            font-size: 2rem;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.8rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1.1rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button.btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 1.2rem;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 1rem;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }
        
        button.btn-primary:active {
            transform: scale(0.98);
        }

        button.btn-primary:disabled {
            background-color: #CBD5E1;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            color: #DC2626;
            font-size: 1rem;
            margin-top: 1rem;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        pre {
            background-color: var(--code-bg);
            color: var(--code-text);
            padding: 1.8rem;
            border-radius: 16px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            line-height: 1.6;
            border-left: 6px solid var(--primary);
            margin-bottom: 2rem;
        }

        .opcion-btn {
            width: 100%;
            background-color: #F8FAFC;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 1.2rem;
            border-radius: 12px;
            text-align: left;
            margin-bottom: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .opcion-btn:hover {
            background-color: #EFF6FF;
            border-color: #93C5FD;
            transform: translateY(-2px);
        }

        .opcion-btn.seleccionada {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(0, 86, 210, 0.3);
            transform: translateY(-2px);
        }

        .progreso {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .nota-destacada {
            font-size: 5rem;
            font-weight: 800;
            text-align: center;
            color: var(--primary);
            margin: 2rem 0;
            text-shadow: 0 4px 20px rgba(0,86,210,0.1);
        }

        #pantalla-examen, #pantalla-resultados {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="pantalla-registro">
        <h1>Evaluación de Python</h1>
        <p class="subtitle">Laboratorio de Programación</p>
        
        <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" placeholder="Ej. Juan Pérez" autocomplete="off" required>
        </div>
        <div class="form-group">
            <label for="cedula">Documento de Identidad</label>
            <input type="number" id="cedula" placeholder="Ej. 1085000000" autocomplete="off" required>
        </div>
        
        <button class="btn-primary" onclick="validarIngreso()">Comenzar Examen</button>
        <p id="error-registro" class="error-msg"></p>
    </div>

    <div id="pantalla-examen">
        <div class="progreso">
            <span id="indicador-progreso">Pregunta 1 de 15</span>
            <span style="color: var(--primary);">Práctica Continua</span>
        </div>
        <div id="contenedor-pregunta"></div>
        <div id="contenedor-opciones" class="form-group"></div>
        <button id="btn-siguiente" class="btn-primary" onclick="siguientePregunta()" disabled>Siguiente Pregunta</button>
    </div>

    <div id="pantalla-resultados">
        <h2>Examen Finalizado</h2>
        <p class="subtitle" id="mensaje-final"></p>
        <div class="nota-destacada" id="nota-final"></div>
        <p style="text-align: center; color: var(--text-muted); font-size: 1.1rem;">
            Tu calificación ha sido registrada en el sistema del profesor exitosamente.
        </p>
    </div>
</div>

<script>
    const bancoTotal = [
    // Preguntas 1 - 10 (Conjuntos y Conceptos Básicos de Funciones)
    { 
        pregunta: "Si tenemos el conjunto A = {1, 2, 3} y el conjunto B = {3, 4, 5}, ¿cuál es el conjunto resultante de la operación de unión A U B?", 
        opciones: [
            "{1, 2, 3, 4, 5}", 
            "{1, 2, 4, 5, 6}", 
            "{1, 2, 3, 3, 4}", 
            "{3, 4, 5, 6, 7}"
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Dado el conjunto universal U = {1, 2, 3, 4, 5, 6}, y los conjuntos A = {2, 4, 6} y B = {1, 2, 3}. ¿Cuál es el resultado de la diferencia A - B?", 
        opciones: [
            "{4, 6}", 
            "{2}", 
            "{1, 3}", 
            "{1, 2, 3}"
        ], 
        correcta: 0 
    },
    { 
        pregunta: "¿Cómo se define conceptualmente la diferencia simétrica entre dos conjuntos (A Δ B)?", 
        opciones: [
            "Elementos que pertenecen a A o a B, pero no a ambos al mismo tiempo.", 
            "Elementos que pertenecen a B pero que no pertenecen a A", 
            "Elementos del conjunto universal que no están en A ni están en B.", 
            "Elementos que pertenecen a A pero que no pertenecen a B"
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Si el conjunto universal es U = {a, b, c, d, e} y se tiene el conjunto X = {a, c, e}, ¿cuál es el complemento de X (X')?", 
        opciones: [
            "{b, d}", 
            "{a, e}", 
            "{a, b}", 
            "{c, d}"
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Dados los conjuntos A = {2, 4, 6, 8, 10} y B = {1, 2, 3, 4, 5}, ¿cuál es el conjunto resultante de la operación de unión A ∪ B?", 
        opciones: [
            "{1, 2, 3, 4, 5, 6, 8, 10}", 
            "{6, 8, 10}", 
            "{2, 4}", 
            "{1, 2, 3, 4, 5}"
        ], 
        correcta: 0 
    },
    { 
        pregunta: "¿Cuál es la condición fundamental entre un Dominio (A) y un Codominio (B) para que una relación sea considerada una función válida?", 
        opciones: [
            "Cada elemento de A se asigna a exactamente un elemento del conjunto B.", 
            "Ningún elemento de A se puede relacionar con los elementos del conjunto B.", 
            "Cada elemento de A se asigna a varios elementos del conjunto B.", 
            "Solo algunos elementos de A se asignan a elementos del conjunto B."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "En el contexto del conjunto de llegada de una función, ¿cuál es la diferencia principal entre el codominio y el rango (imagen)?", 
        opciones: [
            "El codominio son las salidas posibles y el rango son las que efectivamente resultan.", 
            "El codominio es el conjunto de partida y el rango es el de llegada.", 
            "El rango es el conjunto de partida y el codominio es el de llegada.", 
            "El rango son las salidas posibles y el codominio son las que efectivamente resultan."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "¿Qué característica matemática define estrictamente a una función inyectiva (uno a uno)?", 
        opciones: [
            "A elementos distintos del dominio corresponden resultados (imágenes) distintos.", 
            "Todos los elementos del codominio tienen obligatoriamente una imagen asignada.", 
            "Todos los elementos del dominio comparten una única imagen en el codominio.", 
            "A elementos idénticos del dominio corresponden resultados (imágenes) diferentes."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "De acuerdo con la clasificación de funciones, ¿cuándo se considera que una función es sobreyectiva?", 
        opciones: [
            "Cuando todos los elementos del codominio son imagen de al menos un elemento del dominio.", 
            "Cuando existen varios elementos del codominio que se quedan sin ser asignados.", 
            "Cuando un solo elemento del codominio es imagen de todos los elementos del dominio.", 
            "Cuando ningún elemento del codominio es imagen de los elementos del dominio."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "La función f(x) = x² + 1 con dominio {-1, 0, 1, 2} NO es inyectiva porque:", 
        opciones: [
            "Las entradas x = -1 y x = 1 producen exactamente la misma salida y = 2.", 
            "Faltan números negativos en el conjunto del codominio.", 
            "El rango de la función matemática no abarca a todos los números enteros.", 
            "Las entradas x = 0 y x = 2 producen resultados que son números fraccionarios."
        ], 
        correcta: 0 
    },

    // Preguntas 11 - 20 (Rango, Álgebra de Funciones e Inversas)
    { 
        pregunta: "Al realizar el despeje para calcular el rango de la función racional f(x) = 2x / (x - 1), se obtiene la expresión x = y / (y - 2). Según esto, ¿cuál es el rango de la función?", 
        opciones: [
            "Todos los números reales excluyendo el número 2.", 
            "Todos los números reales sin ninguna excepción.", 
            "Todos los números reales excluyendo el número 0.", 
            "Todos los números reales excluyendo el número 1."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Para calcular el rango de la función cuadrática f(x) = x² - 4x + 7 utilizando el discriminante, se plantea la inecuación b² - 4ac ≥ 0. ¿Qué significa esta condición?", 
        opciones: [
            "Garantiza que exista al menos un número real x para producir un valor y.", 
            "Garantiza que la parábola cruzará el eje horizontal en múltiples puntos.", 
            "Garantiza que la función cuadrática solo tendrá raíces imaginarias.", 
            "Garantiza que la ecuación cuadrática pierda su vértice geométrico."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Dadas las funciones f(x) = 2x + 3 y g(x) = x² - 1, ¿cuál es el resultado de evaluar el producto de las funciones (f · g)(2)?", 
        opciones: [
            "21", 
            "15", 
            "28", 
            "10"
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Dadas las funciones lineales f(x) = 3x y g(x) = x + 5, ¿cuál es el resultado algebraico correcto de la composición (f ∘ g)(x)?", 
        opciones: [
            "3x + 15", 
            "x + 15", 
            "4x + 5", 
            "3x + 5"
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Basado en el cálculo de composiciones de funciones, ¿qué se puede concluir matemáticamente al comparar (f ∘ g)(x) con (g ∘ f)(x)?", 
        opciones: [
            "Que la composición de funciones no es una operación conmutativa.", 
            "Que la composición de funciones anula el dominio original.", 
            "Que la composición de funciones es una operación conmutativa.", 
            "Que la composición de funciones es siempre asociativa."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Para poder afirmar que una función matemática posee una función inversa válida y determinista, ¿qué propiedad esencial debe cumplir?", 
        opciones: [
            "Debe ser una función estrictamente biyectiva.", 
            "Debe ser una función exclusivamente sobreyectiva.", 
            "Debe ser una función exclusivamente inyectiva.", 
            "Debe ser una función estrictamente polinómica."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "¿Cuál es el propósito o la acción fundamental que realiza una función inversa f⁻¹(x)?", 
        opciones: [
            "Revertir el mapeo original para devolver el valor a su estado inicial.", 
            "Convertir todos los resultados positivos a su forma negativa.", 
            "Multiplicar los valores del conjunto de partida por los de llegada.", 
            "Duplicar el valor de la salida original de la función."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Aplicando los pasos de despeje algebraico, ¿cuál es la función inversa correspondiente a la función lineal f(x) = 5x - 3?", 
        opciones: [
            "f⁻¹(x) = (x + 3) / 5", 
            "f⁻¹(x) = (x + 5) / 3", 
            "f⁻¹(x) = (x - 3) / 5", 
            "f⁻¹(x) = (x - 5) / 3"
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Durante el proceso de hallar la inversa de la función cúbica f(x) = x³ - 8, se llega a la expresión y + 8 = x³. ¿Qué operación se debe aplicar para terminar de despejar 'x'?", 
        opciones: [
            "Aplicar raíz cúbica a ambos lados de la ecuación.", 
            "Multiplicar por la constante tres a ambos lados.", 
            "Elevar al cuadrado ambos lados de la ecuación.", 
            "Aplicar logaritmos naturales a ambos lados."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "En el análisis de restricciones de conjuntos, ¿cuál es el propósito principal de excluir del dominio aquellos valores que causan divisiones por cero en una función racional?", 
        opciones: [
            "Garantizar que la función sea biyectiva y por lo tanto tenga inversa formal.", 
            "Aumentar artificialmente el número de elementos contenidos dentro del rango.", 
            "Facilitar el proceso de factorización de los términos en el numerador.", 
            "Convertir la función racional compleja en una función de tipo lineal."
        ], 
        correcta: 0 
    }
];

    let preguntasExamen = [];
    let indiceActual = 0;
    let puntaje = 0;
    let respuestaSeleccionada = null;
    let estudianteActual = "";

    function mezclarArreglo(arreglo) {
        let mezclado = [...arreglo];
        for (let i = mezclado.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [mezclado[i], mezclado[j]] = [mezclado[j], mezclado[i]];
        }
        return mezclado;
    }

    function validarIngreso() {
        const nombre = document.getElementById("nombre").value.trim();
        const cedula = document.getElementById("cedula").value.trim();
        const errorElement = document.getElementById("error-registro");

        if (!nombre || !cedula) {
            errorElement.innerText = "Por favor, completa todos los campos.";
            errorElement.style.display = "block";
            return;
        }

        let registros = JSON.parse(localStorage.getItem("registroExamenPython")) || {};

        if (registros[cedula]) {
            errorElement.innerText = `Acceso denegado: Ya presentaste el examen. Tu nota registrada es: ${registros[cedula].nota}`;
            errorElement.style.display = "block";
            return;
        }

        estudianteActual = cedula;
        iniciarExamen();
    }

    function iniciarExamen() {
        preguntasExamen = mezclarArreglo(bancoTotal).slice(0, 15);
        document.getElementById("pantalla-registro").style.display = "none";
        document.getElementById("pantalla-examen").style.display = "block";
        cargarPregunta();
    }

    function cargarPregunta() {
        respuestaSeleccionada = null;
        document.getElementById("btn-siguiente").disabled = true;
        
        const q = preguntasExamen[indiceActual];
        document.getElementById("indicador-progreso").innerText = `Pregunta ${indiceActual + 1} de 15`;
        document.getElementById("contenedor-pregunta").innerHTML = `<pre>${q.pregunta}</pre>`;
        
        const opcionesConIndice = q.opciones.map((texto, i) => ({ texto, esCorrecta: i === q.correcta }));
        const opcionesMezcladas = mezclarArreglo(opcionesConIndice);
        
        const contenedorOpciones = document.getElementById("contenedor-opciones");
        contenedorOpciones.innerHTML = "";
        
        opcionesMezcladas.forEach((opcion) => {
            const btn = document.createElement("button");
            btn.className = "opcion-btn";
            btn.innerText = opcion.texto;
            btn.onclick = () => seleccionarOpcion(btn, opcion.esCorrecta);
            contenedorOpciones.appendChild(btn);
        });
    }

    function seleccionarOpcion(botonClickeado, esCorrecta) {
        respuestaSeleccionada = esCorrecta;
        const botones = document.querySelectorAll(".opcion-btn");
        botones.forEach(btn => btn.classList.remove("seleccionada"));
        botonClickeado.classList.add("seleccionada");
        document.getElementById("btn-siguiente").disabled = false;
    }

    function siguientePregunta() {
        if (respuestaSeleccionada) puntaje++;
        indiceActual++;
        
        if (indiceActual < 15 && indiceActual < preguntasExamen.length) {
            cargarPregunta();
            if (indiceActual === 14 || indiceActual === preguntasExamen.length - 1) {
                document.getElementById("btn-siguiente").innerText = "Finalizar Examen";
            }
        } else {
            mostrarResultados();
        }
    }

    function mostrarResultados() {
        document.getElementById("pantalla-examen").style.display = "none";
        document.getElementById("pantalla-resultados").style.display = "block";
        
        let totalPreguntas = Math.min(15, preguntasExamen.length);
        let notaCalculada = (puntaje / totalPreguntas) * 5.0;
        let notaFinal = Math.max(1.0, notaCalculada).toFixed(1);
        
        const nombre = document.getElementById("nombre").value;
        document.getElementById("mensaje-final").innerHTML = `Acertaste <strong>${puntaje}</strong> de ${totalPreguntas} preguntas, ${nombre}.`;
        document.getElementById("nota-final").innerText = notaFinal;

        let registros = JSON.parse(localStorage.getItem("registroExamenPython")) || {};
        registros[estudianteActual] = {
            nombre: nombre,
            nota: notaFinal,
            fecha: new Date().toLocaleString()
        };
        localStorage.setItem("registroExamenPython", JSON.stringify(registros));

// ENVÍO A GOOGLE SHEETS
        let datosExamen = {
            nombre: nombre,
            cedula: estudianteActual,
            nota: notaFinal,
            fecha: new Date().toLocaleString()
        };

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPaWeyoXuUjimO_S9yqhTnfcVCItd7KZKXFd2S7Nyox297BFyBf-veYIwCk1iEa4EP/exec";

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datosExamen)
        }).then(() => console.log("Enviado")).catch(e => console.error(e));
    }
</script>

</body>
</html>
