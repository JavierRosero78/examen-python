<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --primary: #0056D2;
            --primary-hover: #0043A4;
            --bg-color: #F0F6FF;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --code-bg: #0F172A;
            --code-text: #E2E8F0;
            --shadow: 0 10px 40px -10px rgba(0, 86, 210, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 800px;
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            font-size: 2rem;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.8rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1.1rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button.btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 1.2rem;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 1rem;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }
        
        button.btn-primary:active {
            transform: scale(0.98);
        }

        button.btn-primary:disabled {
            background-color: #CBD5E1;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            color: #DC2626;
            font-size: 1rem;
            margin-top: 1rem;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        pre {
            background-color: var(--code-bg);
            color: var(--code-text);
            padding: 1.8rem;
            border-radius: 16px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            line-height: 1.6;
            border-left: 6px solid var(--primary);
            margin-bottom: 2rem;
        }

        .opcion-btn {
            width: 100%;
            background-color: #F8FAFC;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 1.2rem;
            border-radius: 12px;
            text-align: left;
            margin-bottom: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .opcion-btn:hover {
            background-color: #EFF6FF;
            border-color: #93C5FD;
            transform: translateY(-2px);
        }

        .opcion-btn.seleccionada {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(0, 86, 210, 0.3);
            transform: translateY(-2px);
        }

        .progreso {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .nota-destacada {
            font-size: 5rem;
            font-weight: 800;
            text-align: center;
            color: var(--primary);
            margin: 2rem 0;
            text-shadow: 0 4px 20px rgba(0,86,210,0.1);
        }

        #pantalla-examen, #pantalla-resultados {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="pantalla-registro">
        <h1>Evaluación de Python</h1>
        <p class="subtitle">Expresión y redacción digital</p>
        
        <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" placeholder="Ej. Juan Pérez" autocomplete="off" required>
        </div>
        <div class="form-group">
            <label for="cedula">Documento de Identidad</label>
            <input type="number" id="cedula" placeholder="Ej. 1085000000" autocomplete="off" required>
        </div>
        
        <button class="btn-primary" onclick="validarIngreso()">Comenzar Examen</button>
        <p id="error-registro" class="error-msg"></p>
    </div>

    <div id="pantalla-examen">
        <div class="progreso">
            <span id="indicador-progreso">Pregunta 1 de 15</span>
            <span style="color: var(--primary);">Práctica Continua</span>
        </div>
        <div id="contenedor-pregunta"></div>
        <div id="contenedor-opciones" class="form-group"></div>
        <button id="btn-siguiente" class="btn-primary" onclick="siguientePregunta()" disabled>Siguiente Pregunta</button>
    </div>

    <div id="pantalla-resultados">
        <h2>Examen Finalizado</h2>
        <p class="subtitle" id="mensaje-final"></p>
        <div class="nota-destacada" id="nota-final"></div>
        <p style="text-align: center; color: var(--text-muted); font-size: 1.1rem;">
            Tu calificación ha sido registrada en el sistema del profesor exitosamente.
        </p>
    </div>
</div>

<script>
 const bancoTotal = [
    // Preguntas 1 - 15 (Algoritmos de Lectura, Jerarquía Visual y Documentación de Código)
    { 
        pregunta: "¿Cuál es el objetivo principal al escribir textos para páginas web?", 
        opciones: [
            "Optimizar la información y quitar lo que no sirve para que el mensaje principal se entienda rápido.", 
            "Escribir textos muy largos y detallados como si fueran para una tarea de la universidad.", 
            "Llenar la pantalla con muchas palabras difíciles para que el texto se vea más importante.", 
            "Hacer que la persona pase mucho tiempo leyendo cada palabra con calma."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "¿Para qué tipo de páginas es ideal usar el 'Patrón F' de lectura?", 
        opciones: [
            "Para blogs y páginas de resultados de búsqueda.", 
            "Para páginas de ventas muy simples que solo tienen un botón y una foto.", 
            "Únicamente para el diseño de logotipos y menús pequeños.", 
            "Para formularios cortos donde solo se pide el correo y la contraseña."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "¿Cuál es la principal ventaja de usar el 'Patrón Z' en una página web?", 
        opciones: [
            "Prioriza la simplicidad y lleva la mirada del usuario directo al botón de acción principal (CTA).", 
            "Obliga a las personas a leer textos enormes de arriba hacia abajo sin parar.", 
            "Es la mejor opción para escribir artículos de noticias muy largos.", 
            "Oculta los botones importantes para que el usuario tenga que buscarlos por toda la pantalla."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Según el método de la 'Pirámide Invertida', ¿qué información debe ir en la primera línea de un texto?", 
        opciones: [
            "La conclusión, el dato más importante o la instrucción principal.", 
            "La historia completa y los detalles menos importantes para dar contexto.", 
            "Un saludo largo explicando cómo ha crecido la empresa en los últimos meses.", 
            "Los argumentos secundarios y las explicaciones de apoyo."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "En el diseño visual, ¿para qué sirve dejar 'espacio en blanco' en una pantalla?", 
        opciones: [
            "Para enmarcar, resaltar lo importante, aislar elementos y dar calma visual en pantallas limpias.", 
            "Para demostrar que faltó información por escribir en la página.", 
            "Para hacer que las letras se vean mucho más pequeñas y pegadas entre sí.", 
            "Para confundir al usuario y que no sepa dónde hacer clic."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "En la jerarquía visual, ¿qué logramos al poner elementos muy cerca unos de otros (proximidad)?", 
        opciones: [
            "Que los elementos cercanos parezcan estar agrupados o relacionados entre sí.", 
            "Que los colores brillantes se vean mucho más apagados y oscuros.", 
            "Que las imágenes planas adquieran una textura elaborada.", 
            "Que el texto cambie automáticamente de tamaño grande a pequeño."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "¿Cómo debe ser un buen mensaje de error para el usuario?", 
        opciones: [
            "Claro, con tono humano (sin culpar al usuario) y que ofrezca una solución o paso a seguir.", 
            "Con códigos técnicos y números de programación para que se vea profesional.", 
            "Seco y culpando a la persona por haber presionado mal un botón.", 
            "Confuso y sin botones de salida para que el usuario cierre la página rápido."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Cuando un usuario está a punto de hacer una 'acción irreversible' (como cancelar su plan), ¿cómo deben ser los textos de los botones?", 
        opciones: [
            "Muy claros y sin confusiones (por ejemplo: 'Volver' y 'Sí, cancelar') para evitar errores.", 
            "Confusos (como poner 'Cancelar' y 'Confirmar' juntos) para que el usuario dude.", 
            "Escondidos al final de la página con letras muy pequeñas que casi no se lean.", 
            "Escritos en otro idioma para que el usuario no pueda cancelar su cuenta fácilmente."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "¿Qué es Markdown?", 
        opciones: [
            "Una forma sencilla de dar formato a textos usando símbolos básicos, pudiendo leerse fácilmente en texto simple sin códigos pesados.", 
            "Un programa complicado de diseño gráfico exclusivo para editar fotografías.", 
            "Un lenguaje lleno de etiquetas ocultas y difíciles que no se puede leer a simple vista.", 
            "Un procesador de textos tradicional exactamente igual a Microsoft Word."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "En Markdown, ¿qué símbolo se usa para crear títulos y cómo debe usarse el título principal (H1)?", 
        opciones: [
            "Se usa el símbolo # y solo debe haber un título principal (# H1) por documento, sin saltarse niveles.", 
            "Se usa el símbolo * y se pueden poner todos los títulos principales que uno quiera.", 
            "Se usa el símbolo > al principio de cada línea para hacer la letra más grande.", 
            "Se usan tres guiones --- antes de cada palabra importante."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Si quieres poner una palabra en negrita en Markdown para resaltar un concepto clave, ¿cómo debes escribirla?", 
        opciones: [
            "Rodeando la palabra con dos asteriscos, así: **texto**.", 
            "Rodeando la palabra con un solo asterisco, así: *texto*.", 
            "Poniendo dos signos de tilde a los lados, así: ~~texto~~.", 
            "Poniendo el símbolo de número antes de la palabra, así: # texto."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "¿Cuándo se recomienda usar listas ordenadas (con números: 1., 2.) en lugar de viñetas normales?", 
        opciones: [
            "Cuando se explican pasos estrictos que deben seguirse en orden, como en un tutorial o proceso.", 
            "Cuando se nombran características sueltas donde el orden no importa para nada.", 
            "Únicamente cuando queremos resaltar palabras en otro idioma.", 
            "Cuando queremos hacer una tabla comparativa con muchas columnas."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "¿Cuál es la diferencia en Markdown entre escribir un enlace y poner una imagen?", 
        opciones: [
            "La imagen usa exactamente la misma forma [Texto](URL), pero lleva un signo de exclamación al principio: ![Texto](URL).", 
            "Las imágenes se ponen con tres comillas invertidas y los enlaces con guiones.", 
            "Los enlaces llevan el símbolo # y las imágenes llevan el símbolo >.", 
            "No hay ninguna diferencia, ambos se escriben exactamente igual."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Al documentar código en Markdown, ¿para qué se usan tres comillas invertidas seguidas (```)?", 
        opciones: [
            "Para poner bloques de código de varias líneas (scripts completos) e indicar el lenguaje de programación.", 
            "Para tachar palabras que tienen errores de ortografía en un párrafo.", 
            "Para crear una línea horizontal que divida la página en dos partes.", 
            "Para hacer que un texto normal se convierta en una cita en bloque."
        ], 
        correcta: 0 
    },
    { 
        pregunta: "Según las buenas prácticas para escribir comentarios dentro del código, ¿qué es lo que debe explicar un buen comentario?", 
        opciones: [
            "Debe explicar el 'porqué' se tomó una decisión en el código, y no repetir lo que ya es obvio a simple vista.", 
            "Debe explicar paso a paso cosas obvias, como poner # suma 1 al contador.", 
            "Debe repetir exactamente con palabras el nombre de la función que está abajo.", 
            "Debe contar quién programó el archivo y en qué fecha lo hizo en cada línea."
        ], 
        correcta: 0 
    }
];

    let preguntasExamen = [];
    let indiceActual = 0;
    let puntaje = 0;
    let respuestaSeleccionada = null;
    let estudianteActual = "";

    function mezclarArreglo(arreglo) {
        let mezclado = [...arreglo];
        for (let i = mezclado.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [mezclado[i], mezclado[j]] = [mezclado[j], mezclado[i]];
        }
        return mezclado;
    }

    function validarIngreso() {
        const nombre = document.getElementById("nombre").value.trim();
        const cedula = document.getElementById("cedula").value.trim();
        const errorElement = document.getElementById("error-registro");

        if (!nombre || !cedula) {
            errorElement.innerText = "Por favor, completa todos los campos.";
            errorElement.style.display = "block";
            return;
        }

        let registros = JSON.parse(localStorage.getItem("registroExamenPython")) || {};

        if (registros[cedula]) {
            errorElement.innerText = `Acceso denegado: Ya presentaste el examen. Tu nota registrada es: ${registros[cedula].nota}`;
            errorElement.style.display = "block";
            return;
        }

        estudianteActual = cedula;
        iniciarExamen();
    }

    function iniciarExamen() {
        preguntasExamen = mezclarArreglo(bancoTotal).slice(0, 15);
        document.getElementById("pantalla-registro").style.display = "none";
        document.getElementById("pantalla-examen").style.display = "block";
        cargarPregunta();
    }

    function cargarPregunta() {
        respuestaSeleccionada = null;
        document.getElementById("btn-siguiente").disabled = true;
        
        const q = preguntasExamen[indiceActual];
        document.getElementById("indicador-progreso").innerText = `Pregunta ${indiceActual + 1} de 15`;
        document.getElementById("contenedor-pregunta").innerHTML = `<pre>${q.pregunta}</pre>`;
        
        const opcionesConIndice = q.opciones.map((texto, i) => ({ texto, esCorrecta: i === q.correcta }));
        const opcionesMezcladas = mezclarArreglo(opcionesConIndice);
        
        const contenedorOpciones = document.getElementById("contenedor-opciones");
        contenedorOpciones.innerHTML = "";
        
        opcionesMezcladas.forEach((opcion) => {
            const btn = document.createElement("button");
            btn.className = "opcion-btn";
            btn.innerText = opcion.texto;
            btn.onclick = () => seleccionarOpcion(btn, opcion.esCorrecta);
            contenedorOpciones.appendChild(btn);
        });
    }

    function seleccionarOpcion(botonClickeado, esCorrecta) {
        respuestaSeleccionada = esCorrecta;
        const botones = document.querySelectorAll(".opcion-btn");
        botones.forEach(btn => btn.classList.remove("seleccionada"));
        botonClickeado.classList.add("seleccionada");
        document.getElementById("btn-siguiente").disabled = false;
    }

    function siguientePregunta() {
        if (respuestaSeleccionada) puntaje++;
        indiceActual++;
        
        if (indiceActual < 15 && indiceActual < preguntasExamen.length) {
            cargarPregunta();
            if (indiceActual === 14 || indiceActual === preguntasExamen.length - 1) {
                document.getElementById("btn-siguiente").innerText = "Finalizar Examen";
            }
        } else {
            mostrarResultados();
        }
    }

    function mostrarResultados() {
        document.getElementById("pantalla-examen").style.display = "none";
        document.getElementById("pantalla-resultados").style.display = "block";
        
        let totalPreguntas = Math.min(15, preguntasExamen.length);
        let notaCalculada = (puntaje / totalPreguntas) * 5.0;
        let notaFinal = Math.max(1.0, notaCalculada).toFixed(1);
        
        const nombre = document.getElementById("nombre").value;
        document.getElementById("mensaje-final").innerHTML = `Acertaste <strong>${puntaje}</strong> de ${totalPreguntas} preguntas, ${nombre}.`;
        document.getElementById("nota-final").innerText = notaFinal;

        let registros = JSON.parse(localStorage.getItem("registroExamenPython")) || {};
        registros[estudianteActual] = {
            nombre: nombre,
            nota: notaFinal,
            fecha: new Date().toLocaleString()
        };
        localStorage.setItem("registroExamenPython", JSON.stringify(registros));

// ENVÍO A GOOGLE SHEETS
        let datosExamen = {
            nombre: nombre,
            cedula: estudianteActual,
            nota: notaFinal,
            fecha: new Date().toLocaleString()
        };

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPaWeyoXuUjimO_S9yqhTnfcVCItd7KZKXFd2S7Nyox297BFyBf-veYIwCk1iEa4EP/exec";

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datosExamen)
        }).then(() => console.log("Enviado")).catch(e => console.error(e));
    }
</script>

</body>
</html>
